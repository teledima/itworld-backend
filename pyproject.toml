[project]
name = "payments"
version = "0.1.0"
description = ""
authors = [
    {name = "Дмитрий Телегин",email = "teledima00@gmail.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "django (>=6.1,<7.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "requests (>=2.34.2,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
]

[tool.ruff.lint]
select = ["F", "E", "I", "W"]
exclude = ["src/payments/migrations/*"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.5,<0.17.0)"
]
