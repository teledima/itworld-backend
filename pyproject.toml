[project]
name = "payments"
version = "0.1.0"
description = ""
authors = [
    {name = "Дмитрий Телегин",email = "teledima00@gmail.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "django (>=6.1,<7.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "requests (>=2.34.2,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
]

[tool.ruff.lint]
select = ["F", "E", "I", "W"]
exclude = ["src/payments/migrations/*"]

[tool.pytest]
addopts = ["--create-db"]

[tool.pytest_env]
env_files = [".env.test"]
env_files_skip_if_set = true
DJANGO_SETTINGS_MODULE = "src.settings"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.5,<0.17.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "pytest-env (>=1.7.0,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]
